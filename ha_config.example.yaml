---
# PWRcell Home Assistant Entity Configuration Example
#
# Selected entities to be exposed to Home Assistant via MQTT Discovery.
# This file is generated and updated automatically by the Web Explorer UI.
#
# Entity keys should be scoped to a device serial number (<SERIAL_NUMBER>:<FIELD_KEY>).
# Legacy unqualified keys (<FIELD_KEY>) will automatically be migrated to their
# respective device serial numbers at runtime.

selected_fields:
  # Inverter telemetry
  - 0001000714E9:inverter.live.grid_power_w
  - 0001000714E9:inverter.live.load_power_w
  - 0001000714E9:inverter.live.solar_power_w
  - 0001000714E9:inverter.live.system_mode

  # Battery telemetry
  - 000100082128:battery.live.battery_power_w
  - 000100082128:battery.live.state_of_charge
  - 000100082128:battery.live.state_of_health

  # System operating mode control (Beacon)
  - 0001001206E8:rebus_beacon.REbus_dir.SysMd

  # PV Link metrics (repeat per PV Link serial number)
  - 000100034AC7:pv_link.string_combiner.DCW
  - 000100034AC7:pv_link.string_combiner.DCWh
  - 000100034AC7:pv_link.REbus_status.P
  - 000100034AC7:pv_link.REbus_status.E
