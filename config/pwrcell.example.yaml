---
# PWRcell v3 Configuration
testing: false
poll_rate: 12               # Fast telemetry Modbus polling interval in seconds
config_poll_interval: 45    # Front-panel keypad & config sync interval in seconds
slow_poll_interval: 300     # Diagnostic accumulators polling interval in seconds
enable_polling: true        # Enable background Modbus polling
log_level: INFO             # Logging level: DEBUG, INFO, WARNING, ERROR

pwrcell:
  ssh_tunnel:
    host: 192.168.0.73       # IP address or hostname of Generac Beacon on local LAN
    port: 22
    username: root
    identity_file: /path/to/your/ssh_key

mqtt:
  client_name: pwrcell-ha
  host: homeassistant        # IP or hostname of Home Assistant MQTT Broker
  port: 1883
  username: mqtt-user
  password: your-password

# Optional:
