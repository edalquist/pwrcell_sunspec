  ha_device_class: power
  ha_state_class: measurement
  synonyms:
  - w
  - inverter_power_w
  - inverter_output_power_w
  - inverter_output_power
  - inverter_power
  - real_power
- id: inverter_state
  label: Inverter Operational State
