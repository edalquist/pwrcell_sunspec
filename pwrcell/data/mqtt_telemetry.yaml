version: '1.0'
snapshot_fields:
- device: inv
  name: grid_power_w
  label: Grid Net Power
  description: Real-time power imported from (+) or exported to (-) utility grid
  attr: grid_power_w
  units: W
  platform: sensor
  device_class: power
  state_class: measurement
  entity_category: null
  condition: always
  converter: round1
- device: inv
  name: solar_power_w
  label: Solar Production Power
  description: Total real-time solar generation across all PV strings
  attr: solar_power_w
  units: W
  platform: sensor
  device_class: power
  state_class: measurement
  entity_category: null
  condition: always
  converter: round1
- device: inv
  name: load_power_w
  label: Home Consumption Power
  description: Real-time total electrical power consumed by home loads
  attr: load_power_w
  units: W
  platform: sensor
  device_class: power
  state_class: measurement
  entity_category: null
  condition: always
  converter: round1
- device: inv
  name: system_mode
  label: Live System Mode
  description: Current system operating mode pushed from inverter
  attr: system_mode_name
  units: null
  platform: sensor
  device_class: enum
  state_class: null
  entity_category: null
  condition: always
  converter: same
  options:
    - UNKNOWN
    - GRID_TIE
    - SELF_SUPPLY
    - CLEAN_BACKUP
    - PRIORITY_BACKUP
    - REMOTE_ARBITRAGE
    - SELL
    - SAFETY_SHUTDOWN
- device: inv
  name: inverter_state
  label: Inverter State
  description: PWRcell inverter operational status code
  attr: inverter_state
  units: null
  platform: sensor
  device_class: null
  state_class: null
  entity_category: diagnostic
  condition: notnone
  converter: same
- device: inv
  name: inverter_state_name
  label: Inverter State Name
  description: PWRcell inverter operational status description
  attr: inverter_state_name
  units: null
  platform: sensor
  device_class: enum
  state_class: null
  entity_category: diagnostic
  condition: notnone
  converter: same
  options:
    - UNKNOWN
    - DISABLED
    - ESTOP_ACTIVE
    - INITIALIZING
    - POWERING_UP
    - CONNECTING_BUS
    - DISCONNECTING_BUS
    - TESTING_BUS
    - LOW_BUS_VOLTAGE
    - STANDBY
    - WAITING
    - WAITING_NO_INPUT
    - WAITING_HEARTBEAT
    - CONNECTING_GRID
    - DISCONNECTING_GRID
    - GRID_CONNECTED
    - ISLANDED
    - CONNECTING_GENERATOR
    - GENERATOR_PARALLEL
    - DISCONNECTING_GENERATOR
    - ISLAND_OVERLOAD
    - ISLANDED_WITH_ACCPV
    - ISLANDED_WITHOUT_ACCPV
    - SCHEDULER_DISABLED
    - GROUND_FAULT
    - GROUND_FAULT_LOCKOUT
    - BUS_OVER_VOLTAGE
    - ERROR_GENERIC
    - ERROR_REBUS_FAULT
    - ERROR_INTERNAL_BUS_FAULT
    - CONFIGURATION_ERROR
    - BAD_RESET_ERROR
    - WIRING_ERROR
    - ERROR_FUSE_BLOWN
- device: inv
  name: inverter_id
  label: Inverter Serial Number
  description: Inverter unique identifier from MQTT push
  attr: inverter_id
  units: null
  platform: sensor
  device_class: null
  state_class: null
  entity_category: diagnostic
  condition: truthy
  converter: same
- device: inv
  name: system_family
  label: System Architecture Family
  description: PWRcell system family architecture generation
  attr: system_family
  units: null
  platform: sensor
  device_class: null
  state_class: null
  entity_category: diagnostic
  condition: truthy
  converter: same
- device: beacon
  name: gateway_id
  label: Gateway Serial Number
  description: REbus Beacon gateway identifier from MQTT telemetry
  attr: gateway_id
  units: null
  platform: sensor
  device_class: null
  state_class: null
  entity_category: diagnostic
  condition: truthy
  converter: same
- device: beacon
  name: gateway_type
  label: Gateway Type
  description: REbus Beacon hardware gateway type
  attr: gateway_type
  units: null
  platform: sensor
  device_class: null
  state_class: null
  entity_category: diagnostic
  condition: truthy
  converter: same
- device: bat
  name: battery_power_w
  label: Battery Power
  description: Real-time battery discharge (+) or charge (-) power
  attr: battery_power_w
  units: W
  platform: sensor
  device_class: power
  state_class: measurement
  entity_category: null
  condition: always
  converter: round1
- device: bat
  name: state_of_charge
  label: State of Charge
  description: Battery state of charge percentage
  attr: battery_soc
  units: '%'
  platform: sensor
  device_class: battery
  state_class: measurement
  entity_category: null
  condition: notnone
  converter: round1
- device: bat
  name: state_of_health
  label: State of Health
  description: Battery state of health percentage
  attr: battery_soh
  units: '%'
  platform: sensor
  device_class: battery
  state_class: measurement
  entity_category: null
  condition: notnone
  converter: round1
channel_fields:
