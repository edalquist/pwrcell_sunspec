syntax = "proto3";

package spt_monitor;

message SPTMonitorEvent {
  Timestamp timestamp = 1;
  string beacon_rcpn = 2;
  SPTReadEvent read_event = 3;
}
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}
message SPTReadEvent {
  repeated DeviceSetPointsRead set_point_reads = 1;
}
message DeviceSetPointsRead {
  string device_rcpn = 1;
  Timestamp collection_time = 2;
  DeviceType device_type = 3;
  uint32 hardware_version = 4;
  uint32 software_version = 5;
  string metadata_hash = 6;
  bool non_defaults_only = 7;
  repeated TablesEntry tables = 8;
}
message TablesEntry {
  uint32 key = 1;
  SetPointTable value = 2;
}
message SetPointTable {
  uint32 index = 1;
  uint32 crc = 2;
  repeated PointsEntry points = 3;
}
message PointsEntry {
  uint32 key = 1;
  SetPoint value = 2;
}
message SetPoint {
  uint32 index = 1;
  int32 value = 2;
  SetPointMetaData metadata = 3;
  bool is_default = 4;
}
message SetPointMetaData {
  string label = 1;
  string units = 2;
  int32 default_value = 3;
  int32 minimum = 4;
  int32 maximum = 5;
  int32 significands = 6;
  string description = 7;
}
enum DeviceType {
  UNKNOWN_DEVICE = 0;
  INVERTER = 1;
  BEACON = 2;
  BATTERY = 3;
  PVLINK = 4;
  ICM = 5;
  RGM = 6;
  GENERATOR = 7;
  MICRO_INVERTER = 8;
  GATEWAY = 9;
  LOAD_CONTROLLER = 11;
  LEANCORE = 12;
  MANTA = 13;
  PENGUIN = 14;
}